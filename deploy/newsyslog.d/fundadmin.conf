# FundAdministration 日志轮转 (reliability-4)
# launchd 的 StandardOutPath/StandardErrorPath 会无限增长，最终可能撑满磁盘。
# macOS 自带 newsyslog 负责轮转；本文件为模板。
#
# 安装:
#   1. 按实际仓库/日志路径替换下方 /Users/admin/fundadmin/logs。
#   2. sudo cp deploy/newsyslog.d/fundadmin.conf /etc/newsyslog.d/fundadmin.conf
#   3. sudo newsyslog -nv   # 预演，确认规则被识别
#   newsyslog 由系统 launchd 每小时触发，无需额外配置。
#
# 字段: logfilename                         [owner:group]  mode count size(KB) when flags
/Users/admin/fundadmin/logs/portfolio-sync.out.log         644  7     5120    *    GN
/Users/admin/fundadmin/logs/portfolio-sync.err.log         644  7     5120    *    GN
/Users/admin/fundadmin/logs/streamlit.out.log              644  7     5120    *    GN
/Users/admin/fundadmin/logs/streamlit.err.log              644  7     5120    *    GN
# count=7 保留 7 份；size=5120KB(5MB) 超过即轮转；G=glob, N=不发 HUP 信号。
